name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # GPG signing is optional: when the GPG_PRIVATE_KEY / GPG_FINGERPRINT
      # secrets are not configured, signing is skipped and the release is
      # published unsigned (checksums.txt only, no checksums.txt.asc).
      - name: Check GPG signing secrets
        id: signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_FINGERPRINT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GPG signing secrets found; release artifacts will be signed."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GPG signing secrets not configured; publishing an unsigned release."
          fi

      - name: Import GPG key
        if: steps.signing.outputs.enabled == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean ${{ steps.signing.outputs.enabled == 'false' && '--skip=sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
          # Empty string when the secret is absent (passphrase-less key);
          # goreleaser feeds it to gpg on stdin either way.
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/*
          retention-days: 30
